[tool.poetry]
name = "javsp"
version = "0.2.3"
description = "汇总多站点数据的AV元数据刮削器"
authors = ["Yuukiy <76897913+Yuukiy@users.noreply.github.com>"]
license = "GPL-3.0-only"
readme = "README.md"

[tool.poetry.dependencies]
python = "<3.13,>=3.10"
cloudscraper = "1.2.71"
colorama = "0.4.4"
pillow = "10.2.0"
pretty-errors = "1.2.19"
requests = "2.31.0"
tqdm = "4.59.0"
# https://stackoverflow.com/questions/446209/possible-values-from-sys-platform
pywin32 = {version = "^306", markers = "sys_platform == 'win32'"}
pywin32-ctypes = {version = "^0.2.2", markers = "sys_platform == 'win32'"}
cryptography = "^42.0.5"
pycryptodome = "^3.20.0"
lxml = {extras = ["html-clean"], version = "^5.2.1"}
confz = "^2.0.1"
pydantic-extra-types = "^2.9.0"
# 代码直接 import pydantic / pydantic_core(config.py 的 ByteSize/Field/Url 等),
# 原先仅靠 confz 的传递依赖存在 —— 与 packaging 同类问题: 一旦上游不再传递即崩,
# 故显式声明。pydantic-core 需与 pydantic 版本对齐, 交给 pydantic 自身约束。
pydantic = "^2.9.0"
pydantic-core = "^2.23.0"
pendulum = "^3.0.0"
slimeface = "^2024.9.27"
# WebUI 后端依赖
fastapi = "^0.111.0"
# server.py 直接 import starlette 的 TrustedHostMiddleware(阻断 DNS Rebinding),
# 虽由 fastapi 传递依赖带入, 但属直接使用故显式声明
starlette = "^0.37.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
python-multipart = "^0.0.9"
# 桌面端(PyWebView)依赖
pywebview = "^5.0.0"
# 运行时依赖: javsp/func.py 用到 `from packaging import version`
# 原仅靠 dev 组 cx-freeze 的传递依赖存在, `poetry install --only main` 会把 dev 组排除导致 Docker 镜像缺包崩溃
packaging = "*"

[tool.poetry.scripts]
javsp = "javsp.__main__:entry"
server = "javsp.server:entry"

[[tool.poetry.source]]
name = "mirrors"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"


[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
flake8 = "^7.0.0"
cx-freeze = "^7.2.2"
types-lxml = "^2024.4.14"
types-pillow = "^10.2.0.20240822"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
