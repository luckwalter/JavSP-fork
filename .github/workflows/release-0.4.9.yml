name: 发布 Release v0.4.9

# 触发方式(二选一):
#   1) push 到 master 且本文件有改动 -> 自动触发
#      为什么不用 workflow_dispatch 的 API: fine-grained PAT 拿不到 Actions:write,
#      dispatch 端点会 403; 改用 push 事件可完全避开该权限问题。
#   2) Actions 页面手动 Run workflow
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag'
        required: false
        default: 'v0.4.9'
  push:
    branches: [master]
    paths:
      - '.github/workflows/release-0.4.9.yml'

permissions:
  contents: write      # 建/传/删 Release 资产所需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 幂等检查(Release 已存在则跳过)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || 'v0.4.9' }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 -> 本次跳过(避免重复发布)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检出资产分支
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: release-assets-0.4.9
          path: assets

      - name: 发布 Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || 'v0.4.9' }}
          TITLE: 'JavSP-fork v0.4.9'
        run: |
          set -euo pipefail
          cd assets/release-assets-0.4.9
          ls -lh
          echo "--- sha256 校验(先自检, 再上传) ---"
          sha256sum -c javsp-fork-0.4.9.sha256
          echo "--- 创建 Release ---"
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --latest \
            javsp-fork-0.4.9-image.tar.gz \
            JavSP-0.4.9-windows.zip \
            javsp-fork-0.4.9.sha256
          echo "--- 完成 ---"
          gh release view "$TAG" --json url,tagName,name,isDraft,isPrerelease

      - name: 清理旧版本附件(只保留最新版)
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || 'v0.4.9' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 按**明确指定的 TAG** 决定保留哪个, 绝不靠列表顺序判最新
          # (GitHub 的 releases 返回顺序不可信: 被编辑过的旧 Release 会被置顶,
          #  照顺序取"第一个"会把刚发的资产全删)
          gh api --paginate "/repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name != \"$TAG\") | .id" | while read -r rid; do
            gh api --paginate "/repos/$REPO/releases/$rid/assets" \
              --jq '.[].id' | while read -r aid; do
                echo "删除旧资产 id=$aid (release id=$rid)"
                gh api -X DELETE "/repos/$REPO/releases/assets/$aid"
              done
          done
          echo "--- 清理后各 Release 的资产数 ---"
          gh api --paginate "/repos/$REPO/releases?per_page=100" \
            --jq '.[] | "\(.tag_name): \(.assets | length) 个资产"'

      - name: 删除资产分支(发布完成即清理)
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 资产已上传进 Release, 分支使命完成 -> 立即删掉, 避免仓库长期挂着 125MB 大对象
          git -C assets push origin --delete release-assets-0.4.9
          echo "--- 远端分支现状 ---"
          git -C assets ls-remote --heads origin
